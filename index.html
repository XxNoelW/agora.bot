<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Agona: több AI-agent a böngésződben, a te gépeden.">
<title>Agona</title>
<script>
try {
  var saved = JSON.parse(localStorage.getItem('agona:v1') || 'null');
  var theme = saved && saved.settings && saved.settings.theme;
  var light = window.matchMedia('(prefers-color-scheme: light)').matches;
  var resolved = theme === 'light' || theme === 'dark' ? theme : (light ? 'light' : 'dark');
  document.documentElement.setAttribute('data-theme', resolved);
  if (saved && saved.settings && saved.settings.sidebarCollapsed) {
    document.documentElement.setAttribute('data-sidebar', 'collapsed');
  }
} catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='10' fill='%23141414' stroke='%23EDEDED' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='14' r='1.8' fill='%23EDEDED'/%3E%3Ccircle cx='20' cy='14' r='1.8' fill='%23EDEDED'/%3E%3Cpath d='M12 20c1.5 1.7 6.5 1.7 8 0' fill='none' stroke='%23EDEDED' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

        <span class="lbl">Agona</span>
      </a>
      <button id="collapse-btn" type="button" data-act="collapse" aria-label="Oldalsáv összecsukása" aria-expanded="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
    </div>
    <nav id="nav">

      <a href="#/log" data-route="log"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M7 4h8l4 4v12H7zM15 4v4h4M9 12h6M9 16h6"/></svg><span class="lbl">Napló</span></a>

    </nav>
    <div class="side-bottom">
      <button id="theme-btn" type="button" class="ghost theme-btn" data-act="cycle-theme">Téma</button>
      <div id="model-status" class="model-status" role="status">A segéd még nincs betöltve</div>
    </div>
  </aside>
  <div id="scrim" class="scrim"></div>
  <button id="menu-btn" class="menu-btn" type="button" data-act="menu" aria-label="Menü">

  </button>
  <main id="view" tabindex="-1"></main>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="toast" role="status"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box" id="modal-box"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
