<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Agona is a team of helpers in your browser. Agora AI answers, and can search the web.">
<title>Agona</title>
<script>
try {
  var saved = JSON.parse(localStorage.getItem('agona:v1') || 'null');
  var theme = saved && saved.settings && saved.settings.theme;
  var light = window.matchMedia('(prefers-color-scheme: light)').matches;
  var resolved = theme === 'light' || theme === 'dark' ? theme : (theme === 'system' ? (light ? 'light' : 'dark') : 'dark');
  document.documentElement.setAttribute('data-theme', resolved);
} catch (e) {}
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='10' fill='%23141414' stroke='%23EDEDED' stroke-width='1.6'/%3E%3Ccircle cx='12' cy='14' r='1.8' fill='%23EDEDED'/%3E%3Ccircle cx='20' cy='14' r='1.8' fill='%23EDEDED'/%3E%3Cpath d='M12 20c1.5 1.7 6.5 1.7 8 0' fill='none' stroke='%23EDEDED' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#thread">Skip to the conversation</a>
<div id="app">
  <aside id="sidebar" aria-label="Agents and chats">
    <div class="side-top">
      <a class="brand" href="#/">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="14" r="1.8"/><circle cx="20" cy="14" r="1.8"/><path d="M12 20c1.5 1.7 6.5 1.7 8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
        <span class="lbl">Agona</span>
      </a>
    </div>
    <button type="button" class="create-btn" data-act="open-create">Create agent</button>
    <p class="section-label" id="agents-label">Agents</p>
    <div id="agent-list" class="agent-scroll" role="list" aria-labelledby="agents-label"></div>
    <div class="chats-head">
      <p class="section-label" id="chats-label">Chats</p>
      <button type="button" class="quiet" data-act="new-chat">New chat</button>
    </div>
    <div id="chat-list" class="chat-scroll" role="list" aria-labelledby="chats-label"></div>
    <div class="chats-head">
      <p class="section-label" id="groups-label">Groups</p>
      <button type="button" class="quiet" data-act="open-group">New group</button>
    </div>
    <div id="group-list" class="chat-scroll" role="list" aria-labelledby="groups-label"></div>
    <div class="side-bottom">
      <button type="button" class="quiet settings-btn" data-act="open-settings">Settings</button>
      <div id="model-status" class="model-status" role="status">Agora AI</div>
    </div>
  </aside>
  <div id="scrim" class="scrim" data-act="close-menu"></div>
  <main id="chat">
    <header class="chat-top">
      <button id="menu-btn" class="icon" type="button" data-act="menu" aria-label="Open the agent list" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div id="chat-head"></div>
    </header>
    <div id="thread" tabindex="-1" aria-live="polite"></div>
    <form id="composer" class="composer" autocomplete="off">
      <label class="sr-only" for="input">Message</label>
      <button type="button" class="quiet continue-btn" id="continue" data-act="continue-group" hidden>Continue</button>
      <div class="pill">
        <textarea id="input" rows="1" placeholder="Message"></textarea>
        <button type="submit" class="send" id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 17V7M8 11l4-4 4 4"/></svg>
        </button>
        <button type="button" class="send stop" id="stop" data-act="stop" aria-label="Stop" hidden>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
      </div>
    </form>
  </main>
</div>
<div id="live" class="sr-only" aria-live="polite"></div>
<div id="toast" role="status"></div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal-box" id="modal-box"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
